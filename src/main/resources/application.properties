
spring.application.name=HestIA

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hestia}
spring.datasource.username=${DB_USERNAME:hestia}
spring.datasource.password=${DB_PASSWORD:hestia}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

hestia.alert-service.base-url=${ALERT_SERVICE_URL:http://localhost:3001}
hestia.alert-service.timeout=${ALERT_SERVICE_TIMEOUT:2s}

# Canal real de recuperacao: configurar SMTP e URL HTTPS no ambiente.
hestia.recuperacao.remetente=${RECOVERY_FROM:}
hestia.recuperacao.url-publica=${PUBLIC_APP_URL:}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configuracao do Assistente RAG
# A chave OPENAI_API_KEY deve estar configurada no ambiente.
hestia.rag.modelo=${HESTIA_RAG_MODELO:gpt-4o-mini}

# Permite respostas gerais quando nao existem fontes autorizadas.
hestia.rag.permitir-resposta-geral=${HESTIA_RAG_PERMITIR_RESPOSTA_GERAL:false}

hestia.rag.contexto.max-caracteres=${RAG_CONTEXT_MAX_CHARS:6000}
hestia.rag.contexto.turnos-recentes=${RAG_CONTEXT_RECENT_TURNS:4}
hestia.rag.contexto.max-interacoes=${RAG_CONTEXT_MAX_INTERACTIONS:100}
hestia.rag.contexto.resumo-caracteres=${RAG_CONTEXT_SUMMARY_CHARS:1200}
hestia.alert-service.health-enabled=${ALERT_HEALTH_ENABLED:false}
hestia.catalogo.demonstracao=true
