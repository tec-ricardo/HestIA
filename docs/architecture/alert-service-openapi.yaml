openapi: 3.1.0
info:
  title: HestIA Alert Service
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is healthy
  /api/v1/notifications:
    post:
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotification"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "200":
          description: Existing idempotent notification
        "400":
          description: Invalid request
    get:
      operationId: listNotifications
      parameters:
        - in: query
          name: empresaId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Notifications for one company
  /api/v1/notifications/{id}:
    get:
      operationId: getNotification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification found
        "404":
          description: Notification not found
components:
  schemas:
    CreateNotification:
      type: object
      required: [empresaId, origem, tipo, valor, mensagem, idempotencyKey]
      properties:
        empresaId: { type: integer, format: int64, minimum: 1 }
        origem: { type: string, minLength: 2, maxLength: 80 }
        tipo: { type: string, minLength: 2, maxLength: 80 }
        valor: { type: number, minimum: 0, maximum: 100 }
        mensagem: { type: string, minLength: 2, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
    Notification:
      allOf:
        - $ref: "#/components/schemas/CreateNotification"
        - type: object
          required: [id, nivel, status, createdAt, correlationId]
          properties:
            id: { type: string, format: uuid }
            nivel: { type: string, enum: [INFO, WARNING, CRITICAL] }
            status: { type: string, enum: [CREATED] }
            createdAt: { type: string, format: date-time }
            correlationId: { type: string }
