name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: ./mvnw --batch-mode test

  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alert-service/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-End/hestia-prototipo-sprint1-atualizado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front-End/hestia-prototipo-sprint1-atualizado/package-lock.json
      - run: npm ci
      - run: node --check server.js

  optimization-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model/optimization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
