name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  java-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: hestia_ci
          POSTGRES_USER: hestia_ci
          POSTGRES_PASSWORD: hestia_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hestia_ci -d hestia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HESTIA_PG_TEST_URL: jdbc:postgresql://localhost:5432/hestia_ci
      HESTIA_PG_TEST_USER: hestia_ci
      HESTIA_PG_TEST_PASSWORD: hestia_ci_ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: ./mvnw --batch-mode test
      - name: Preserve Java test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: target/surefire-reports/

  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alert-service/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-End/hestia-prototipo-sprint1-atualizado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front-End/hestia-prototipo-sprint1-atualizado/package-lock.json
      - run: npm ci
      - run: node --check server.js

  optimization-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model/optimization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python run_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-scenarios
          path: |
            model/optimization/results/
            model/optimization/scenarios/
