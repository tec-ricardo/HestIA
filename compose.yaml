services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hestia
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hestia-postgres:/var/lib/postgresql/data

  alert-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start"
    environment:
      PORT: 3001
      WARNING_THRESHOLD: 70
      CRITICAL_THRESHOLD: 90
    ports:
      - "3001:3001"
    volumes:
      - ./alert-service:/app

volumes:
  hestia-postgres:
