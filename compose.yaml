services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hestia
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hestia-postgres:/var/lib/postgresql/data

volumes:
  hestia-postgres:
